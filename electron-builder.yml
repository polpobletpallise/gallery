appId: com.mnemotheca.app
productName: Mnemotheca
directories:
  output: dist
  buildResources: resources

files:
  - from: .
    filter:
      - package.json
      - LICENSE
      - app/**/*

win:
  artifactName: ${productName}-${version}.${ext}
  target:
    - nsis
    - portable
  icon: build/icons/icon.ico

publish:
  provider: github
  owner: polpobletpallise
  repo: mnemotheca

nsis:
  artifactName: ${productName}-${version}_Setup.${ext}
  oneClick: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: Mnemotheca
  differentialPackage: true